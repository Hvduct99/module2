<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

            let n = parseInt(prompt("Nhập số phần tử (n <= 50):"));

            while (n <= 0 || n > 50 || isNaN(n)) {
                n = parseInt(prompt("Vui lòng nhập lại số phần tử (n <= 50):"));
            }
            let arr = [];
            for (let i = 0; i < n; i++) {
                let num = parseInt(prompt(`Nhập phần tử thứ ${i + 1}:`));
                while (isNaN(num)) {
                    num = parseInt(prompt(`Vui lòng nhập lại số nguyên cho arr[${i}]:`));
                }
                arr.push(num);
            }
            let sum = 0;
            let count = 0;
            for (let i = 0; i < n; i += 2) {
                if (arr[i] % 2 !== 0) {
                    sum += arr[i];
                    count++;
                }
            }
            if (count === 0) {
                document.write("Không có số lẻ ở vị trí chẵn.");
            } else {
                document.write(`Trung bình cộng các số lẻ ở vị trí chẵn: ${(sum / count)}`);
            }
    </script>
</body>
</html>
