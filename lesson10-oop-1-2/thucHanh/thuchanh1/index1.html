<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        let myDate = function(day, month, year) {
            this.ngay = day;
            this.thang = month;
            this.nam = year;
            this.getDay = function() {
                return this.ngay;
            }
            this.getMonth = function() {
                return this.thang;
            }
            this.getYear = function() {
                return this.nam;
            }
            this.setDay = function(ngay) {
                this.ngay = ngay;
            }
            this.setMonth = function(thang) {
                this.thang = thang;
            }
            this.setYear = function(nam) {
                this.nam = nam;
            }
        }
        let date = new myDate(2, 2, 2007);
        let day = date.getDay();
        let month = date.getMonth();
        let year = date.getYear();
        alert(day + "/" + month + "/" + year);
    </script>
</body>
</html>
