<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        let n = +prompt("Nhập số n: ");
        let arr = [];
        function giaiThua(n) {
            if (n == 0 || n == 1) {
                return 1;
            }else{
                for (let i = 2; i <= n; i++) {
                    arr[i] = arr[i - 1] * i;
                }
                return arr[n];
            }
        }

    </script>
</body>
</html>
