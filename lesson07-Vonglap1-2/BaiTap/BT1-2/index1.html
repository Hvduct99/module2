<!DOCTYPE html>

<body>
    <script>

        let n = +prompt("Nhập số n: ");
        function fibonacci(n) {
            let arr = [0, 1];
            for (let i = 2; i <= n; i++) {
            arr[i] = arr[i - 1] + arr[i - 2];
        }
             return arr;
        }
        alert(fibonacci(n));
    </script>
</body>
