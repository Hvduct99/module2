            function sumFirst30MultiplesOf7() {
                let sum = 0;
                let count = 0;
                let number = 0;

                
                while (count < 30) {
                    if (number % 7 === 0) {
                        sum += number;
                        count++;
                    }
                    number++;
                }

                return sum;
            }

            
            const result = sumFirst30MultiplesOf7();
            console.log("Tổng của 30 số chia hết cho 7 đầu tiên là:", result);
