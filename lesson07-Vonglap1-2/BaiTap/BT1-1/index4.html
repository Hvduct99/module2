        let n = +prompt("Nhập vào số nguyên dương n: ");
        
        if(n < 0) {
            alert("Nhập lại số nguyên dương n: ");
        } else {
            let a = [0, 1];
            let sum = 0 ;
            for(let i = 2; i<n; i++) {
                a[i] = a[i-1] + a[i-2];
                sum += a[i];
            }
            alert("Dãy Fibonacci với " + n + " phần tử: " + a.join(", ") + "\nTổng: " + sum);
        }
