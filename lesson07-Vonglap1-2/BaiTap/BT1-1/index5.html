<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = +prompt("Nhập vào số nguyên dương n: ");
        if(n < 0) {
            alert("Nhập lại số nguyên dương n: ");
        } else {
            let a = [0, 1];
            for(let i = 2; i<n; i++) {
                a[i] = a[i-1] + a[i-2];
                if(a[i] % 5 === 0) {
                    alert(`trong day fibonacci${n} phan tu vua nhap co ${a[i]} la so dau tien 12 chia het cho 5`);
                    break;
                }
            }
            
        }
    </script>
</body>
</html>
