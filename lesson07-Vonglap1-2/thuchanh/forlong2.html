<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let tble;
        tble = "<table border='1' width='300' cellspacing='0' cellpadding='3'>";
            for(let i = 1; i <= 10; i++) {
                tble = tble + "<tr>";
                for(j = 1; j <= 10; j++) {
                    tble = tble + "<td>" + i*j + "</td>";
                }
                tble = tble + "</tr>";
            }
            tble = tble + "</table>";
            document.write(tble);
    </script>
</body>
</html>
