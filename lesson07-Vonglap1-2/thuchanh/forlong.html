<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop Example</title>
</head>
<body>
    <h1>For Loop Example</h1>
    <script>
       let sout;
       sout = "<table border='1' width='300' cellspacing='0' cellpadding='3'>";
        for(let i = 1; i <= 10; i++) {
            sout = sout + "<tr>";
            for(j = 1; j <= 10; j++) {
                sout = sout + "<td>" + i*j + "</td>";
            }
            sout = sout + "</tr>";
        }
        sout = sout + "</table>";
        document.write(sout);
    </script>
    <script>
        
    </script>
</body>
</html>
