<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        let num = +prompt("nhap vao so cac phan tu:");
        let total = 0;
        for(var i = 1; i <= num; i++) {
            total += i;
        }
        alert(`Tong tu 1 den ${num} = ${total}`);
    </script>
</body>
