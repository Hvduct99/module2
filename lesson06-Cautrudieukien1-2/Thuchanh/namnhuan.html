<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let year = +(prompt("Nhap vao nam:"));
        let isLeapYear = false;

        let isDiv4 = year % 4 == 0;
        if(isDiv4) {
            let isDiv100 = year % 100 == 0;
            if(isDiv100) {
                let isDiv400 = year % 400 == 0;
                if(isDiv400) {
                    isLeapYear = true;
                }
            }else {
                isLeapYear = true;
            }
        }
        if(isLeapYear) {
            alert(year + "la nam nhuan");
        }else {
            alert(year + "khong phai nam nhuan");
        }
    </script>
</body>
</html>
