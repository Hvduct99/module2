<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x = "+";
        var a = 4;
        var b = 5;
        switch(x) {
            case'+':
                alert("a + b = " +(a + b));
                break;
            case'-':
                alert("a - b = " +(a - b));
                break;
            case'*':
                alert("a * b = " +(a * b));
                break;
            case'/':
                alert("a / b = " +(a / b));
                break;
            default:
                alert("khong co phep toan");
                break;
        }
    </script>
</body>
</html>
